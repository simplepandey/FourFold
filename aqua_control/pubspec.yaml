name: aqua_control
description: AquaControl - Smart Water Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI
  fl_chart: ^0.67.0
  google_fonts: ^6.2.1
  lottie: ^3.1.0

  # Device / hardware
  mobile_scanner: ^5.1.1
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.32.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  sendotp_flutter_sdk: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
